# Ship to production, on every push to main.
#
# This reverses the original decision, which was tags-only on the grounds that
# a form taking money should go live when somebody decides it should. What that
# argument missed is where the deciding actually happens: nothing reaches main
# except through a reviewed pull request, so the merge *is* the decision, and a
# tag afterwards is a second ceremony for the same choice. Requiring both meant
# every change waited on somebody being at a laptop -- which in practice is how
# a fix sits unshipped for a day.
#
# Tags still deploy, and so does workflow_dispatch. Nothing was taken away.
#
# What still gates a release, so that "on push" is not the only thing standing
# between a merge and production:
#
#   - ci.yml on the pull request, and `make test` again in this job, because a
#     tag or a dispatch can name a commit CI never saw.
#   - the loopback health check in deploy.sh, which rolls the binary back by
#     itself when the new one does not answer.
#   - the `production` environment below. If it has required reviewers, this
#     waits for one -- which is how to get the old behaviour back for a single
#     risky change without editing this file.
#
# Two things to know before relying on it:
#
#   - A pushed deploy ships the BINARY ONLY. There is no secrets.env in CI, so
#     deploy.sh leaves the server's config.toml alone -- deliberately, because
#     the Stripe keys, the SMTP password and the grant signing key must never
#     pass through GitHub. A merge that introduces a *required* config key will
#     therefore fail the pre-flight and swap nothing, which is safe but stalls
#     until somebody runs `make secrets-install` from a laptop. That is not
#     hypothetical: the [stripe] section was exactly such a change.
#   - GitHub Actions minutes on this account have run out before. Deploying on
#     every push spends more of them than tagging did, and a feast-week release
#     that cannot run is a bad week to discover the quota. deploy/deploy.sh from
#     a laptop is the fallback and needs nothing from GitHub.
#
# Be clear-eyed about what this workflow holds. The target is a konsoleH
# account with no root, so there is no sudoers entry that can narrow the deploy
# key to a single installer command the way the VPS sibling does: whoever holds
# DEPLOY_SSH_KEY_B64 has a shell on that account. That is accepted deliberately
# and is the main argument for the tag trigger and for the `production`
# environment below, which can require a reviewer.
#
# What this deliberately does NOT hold: Stripe keys, SMTP credentials, the
# grant signing key. Those reach the server through `make secrets-install` from
# a laptop and never pass through GitHub, so a compromise here stops at "can
# deploy code" rather than also being "can charge cards".
name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Two deploys at once would race on the binary swap, and on push that is no
# longer a theoretical case: merging two pull requests a minute apart starts
# two. They queue.
#
# Never cancel one in flight, however tempting it looks when three are queued.
# The dangerous moment is between `supervise.sh stop` and the rename, and a job
# cancelled there leaves the service down with no binary in place.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # Stays grey rather than red before the server exists. `make secrets-push`
    # sets this variable, so an unconfigured repository simply does not deploy.
    if: vars.EMBED_HOST != ''

    steps:
      - name: every required secret, named at once
        # All of them in one step on purpose. Discovering these one at a time,
        # five minutes apart, is a bad afternoon. Only emptiness is reported --
        # never a value, not even a length.
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS_B64: ${{ secrets.DEPLOY_KNOWN_HOSTS_B64 }}
          EMBED_HOST: ${{ vars.EMBED_HOST }}
          ADMIN_HOST: ${{ vars.ADMIN_HOST }}
          EMBED_PORT: ${{ vars.EMBED_PORT }}
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}
          APP_DIR: ${{ vars.APP_DIR }}
          EMBED_DOCROOT: ${{ vars.EMBED_DOCROOT }}
          ADMIN_DOCROOT: ${{ vars.ADMIN_DOCROOT }}
        run: |
          missing=
          for key in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PORT \
                     DEPLOY_SSH_KEY_B64 DEPLOY_KNOWN_HOSTS_B64 \
                     EMBED_HOST ADMIN_HOST EMBED_PORT ADMIN_PORT \
                     APP_DIR EMBED_DOCROOT ADMIN_DOCROOT; do
            [ -n "${!key:-}" ] || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::not configured. Run 'make secrets-push' locally. Empty:$missing"
            exit 1
          fi
          echo "all required secrets and variables are present"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # deploy.sh reports which commit it is building, and a shallow clone
          # leaves it unable to say.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: tests, re-run here rather than trusted from CI
        # The tag may point at a commit CI never saw, and this is the last
        # moment before a binary reaches a machine that takes payments.
        run: make test

      - name: deploy, health-check, roll back on failure
        # deploy.sh owns the ordering: nothing destructive until the upload is
        # known good, the database copied only while the writer is stopped, the
        # binary swapped by rename, and a rollback if the loopback check fails.
        # A failed *public* check keeps the release, because that cannot tell a
        # bad binary from a misconfigured Apache.
        env:
          CI: "1"
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS_B64: ${{ secrets.DEPLOY_KNOWN_HOSTS_B64 }}
          EMBED_HOST: ${{ vars.EMBED_HOST }}
          ADMIN_HOST: ${{ vars.ADMIN_HOST }}
          EMBED_PORT: ${{ vars.EMBED_PORT }}
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}
          APP_DIR: ${{ vars.APP_DIR }}
          EMBED_DOCROOT: ${{ vars.EMBED_DOCROOT }}
          ADMIN_DOCROOT: ${{ vars.ADMIN_DOCROOT }}
        run: deploy/deploy.sh --skip-tests

      - name: what is live
        if: always()
        env:
          EMBED_HOST: ${{ vars.EMBED_HOST }}
          ADMIN_HOST: ${{ vars.ADMIN_HOST }}
        run: |
          for host in "$EMBED_HOST" "$ADMIN_HOST"; do
            printf '%-32s %s\n' "https://$host/healthz" \
              "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$host/healthz" || echo unreachable)"
          done
